<style>

.score{font-size:clamp(64px,12vw,110px);font-weight:900;line-height:.9;letter-spacing:-.07em;margin:10px 0}

q:[["3 canetas custam R$ 6. Quanto custam 5 canetas (R$)?",10],["Um carro anda 240 km em 3 h. Quantos km anda em 5 h na mesma velocidade?",400],["4 operários fazem uma obra em 12 dias. Quantos dias levam 8 operários?",6]]},
{g:"Matemática",id:"frac",n:"Frações e decimais",math:1,
e:[["Somar frações","Com mesmo denominador, some só o de cima. Com denominadores diferentes, iguale antes.<div class='ex'>1/2 + 1/4 = 2/4 + 1/4 = <b>3/4</b></div>"],
["Fração de um número","Divida pelo de baixo e multiplique pelo de cima.<div class='ex'>3/4 de 40 → 40 ÷ 4 = 10 → 10 × 3 = <b>30</b></div>"],
["Fração em decimal","Divida o de cima pelo de baixo.<div class='ex'>2/5 = 2 ÷ 5 = <b>0,4</b></div>"]],

{g:"Matemática",id:"uni",n:"Unidades de medida",math:1,
e:[["Comprimento","1 km = 1000 m | 1 m = 100 cm<div class='ex'>2,5 km = 2,5 × 1000 = <b>2500 m</b></div>"],
["Massa","1 kg = 1000 g | 1 tonelada = 1000 kg"],
["Volume e tempo","1 L = 1000 mL | 1 h = 60 min | 1 min = 60 s<div class='ex'>3 h = 3 × 60 = <b>180 min</b></div>"]],

{g:"Português",id:"int",n:"Interpretação de texto",
e:[["Leia com calma","Leia o texto <b>duas vezes</b> antes de ver as perguntas. Depois, volte ao trecho que a questão cita."],
["Ideia principal","É o assunto sobre o qual o texto inteiro fala. Não é um detalhe, é o tema geral."],
["Cuidado com palavras absolutas","Palavras como <b>sempre, nunca, todos, apenas</b> costumam deixar a alternativa errada."],
["Inferência","É concluir algo que o texto sugere sem dizer direto. Mas a conclusão precisa ter base no texto."]],
q:[["Em uma questão de interpretação, o que fazer primeiro?",["Chutar a alternativa mais longa","Ler o texto com atenção e depois a pergunta","Ler só as alternativas","Ler só o título"],1,"Ler o texto com atenção evita erros por pressa."],
["Alternativas com “sempre”, “nunca” e “todos” geralmente estão...",["Corretas","Erradas, por serem muito absolutas","Sem importância","Sempre as primeiras"],1,"Palavras absolutas quase sempre exageram o que o texto diz."],
["A ideia principal de um texto é...",["O detalhe mais curioso","O assunto geral de que o texto trata","A última frase","O nome do autor"],1,"É o tema que atravessa o texto inteiro."]]},
{g:"Português",id:"orto",n:"Acentuação e ortografia",
e:[["Oxítonas","Última sílaba forte. Acentuam-se se terminam em <b>a, e, o, em</b> (+ s): <i>sofá, café, avô, também</i>."],
["Paroxítonas","Penúltima sílaba forte. Acentuam-se em geral se terminam em <b>l, r, x, n, i, us, ão, ps</b>: <i>fácil, açúcar, órfão</i>."],
["Proparoxítonas","Antepenúltima sílaba forte. <b>Todas</b> têm acento: <i>lâmpada, máquina, técnico</i>."],
["Mas / mais","<b>Mas</b> = porém. <b>Mais</b> = quantidade.<div class='ex'>Estudei mais, mas ainda quero revisar.</div>"]],
q:[["Qual palavra está escrita corretamente?",["Tecnico","Técnico","Têcnico","Técnicó"],1,"“Técnico” é proparoxítona, e toda proparoxítona leva acento."],
["Complete: “Estudei ___, ___ errei a questão.”",["mas / mais","mais / mas","mais / mais","mas / mas"],1,"Primeiro é quantidade (mais), depois é oposição (mas)."],
["Qual palavra é proparoxítona?",["Café","Fácil","Lâmpada","Também"],2,"Lâmpada: a sílaba forte é a antepenúltima (lâm-pa-da)."]]},
{g:"Português",id:"conc",n:"Concordância",
e:[["Verbal","O verbo concorda com o sujeito em número e pessoa.<div class='ex'>Os alunos <b>estudam</b>. / O aluno <b>estuda</b>.</div>"],
["Nominal","Artigo, adjetivo e substantivo concordam em gênero e número.<div class='ex'>As provas <b>difíceis</b>.</div>"],
["Cuidado","Não importa o que vem no meio: ache o sujeito.<div class='ex'>O resultado das provas <b>chegou</b>. (sujeito: resultado)</div>"]],
q:[["Qual frase está correta?",["Os alunos estuda muito","Os alunos estudam muito","O alunos estudam muito","Os aluno estudam muito"],1,"Sujeito plural (os alunos) pede verbo plural (estudam)."],
["Qual frase está correta?",["As provas foram difíceis","As provas foi difíceis","As prova foram difícil","As provas foram difícil"],0,"Todos os termos concordam no plural."]]},
{g:"Português",id:"cl",n:"Classes de palavras",
e:[["Substantivo, adjetivo e verbo","<b>Substantivo</b> nomeia (casa, beleza). <b>Adjetivo</b> caracteriza (casa <i>grande</i>). <b>Verbo</b> indica ação ou estado (correr, ser)."],["Advérbio e pronome","<b>Advérbio</b> modifica verbo, adjetivo ou outro advérbio (<i>muito, rapidamente, aqui</i>). <b>Pronome</b> substitui o nome (ele, meu, isto, ninguém)."],["Preposição e conjunção","<b>Preposição</b> liga palavras (de, para, em, com). <b>Conjunção</b> liga orações: <b>mas</b> (oposição), <b>e</b> (adição), <b>porque</b> (explicação), <b>portanto</b> (conclusão)."]],
q:[["Em “Ele corre rapidamente”, “rapidamente” é:",["Adjetivo","Advérbio","Substantivo","Pronome"],1,"Modifica o verbo “corre”."],["Qual conjunção indica oposição?",["e","porque","mas","portanto"],2,"“Mas” opõe duas ideias."],["Em “O cachorro é fiel”, “fiel” é:",["Substantivo","Verbo","Advérbio","Adjetivo"],3,"Caracteriza “cachorro”."]]},
{g:"Português",id:"cr",n:"Crase e pontuação",
e:[["Quando usar crase","Crase é <b>a + a</b>. Teste: troque a palavra por uma masculina. Se ficar “ao”, use crase.<div class='ex'>Vou <b>à</b> escola (vou <b>ao</b> colégio ✔)</div>"],["Quando NÃO usar","Não use antes de <b>verbo</b>, <b>pronome</b> (ela, você) ou palavra <b>masculina</b>.<div class='ex'>Começou a chover. | Fui a pé.</div>"],["Vírgula","Use para separar <b>listas</b>, <b>vocativo</b> e <b>expressão no início da frase</b>. Nunca separe sujeito e verbo.<div class='ex'>Comprei pão, leite e ovos. | Ana, venha cá!</div>"]],
q:[["Qual frase tem crase correta?",["Fui à padaria.","Vou à pé.","Disse à ele.","Começou à chover."],0,"Fui ao mercado → fui à padaria."],["Qual frase tem a vírgula correta?",["Maria, comprou pão.","Pedro, venha aqui!","Ele disse, que viria.","Comprei, pão e leite."],1,"A vírgula separa o vocativo."],["Complete: “Chegamos ___ cidade ontem.”",["a","à","as","há"],1,"Chegar a + a cidade = à cidade."]]},
{g:"Português",id:"it",n:"Interpretação com texto",
e:[["Passo a passo","1) Leia o texto todo. 2) Leia a pergunta. 3) Volte ao trecho e marque a resposta. <b>A resposta certa está no texto</b>, não na sua opinião."],["Tipos de pergunta","<b>Explícita:</b> está escrita. <b>Inferência:</b> dedução apoiada no texto. <b>Ideia principal:</b> tema geral. <b>Sentido da palavra:</b> olhe o contexto."]],
q:[[TX("A empresa reduziu o consumo de energia em 20% depois de trocar as lâmpadas comuns por lâmpadas de LED.","Segundo o texto, o que reduziu o consumo?"),["A troca das lâmpadas por LED","Desligar as máquinas","Mudar de prédio","Contratar mais gente"],0,"Está dito de forma direta."],[TX("Pedro acordou tarde, perdeu o ônibus e chegou atrasado à prova.","Por que Pedro se atrasou?"),["Choveu muito","Acordou tarde e perdeu o ônibus","Errou o endereço","Passou mal"],1,"O texto mostra a causa."]]},
{g:"Matemática",id:"med",n:"Média, MMC e MDC",math:1,
e:[["Média","Some tudo e divida pela quantidade.<div class='ex'>Notas 6, 8 e 10 → (6+8+10) ÷ 3 = <b>8</b></div>"],["MMC","Menor múltiplo comum. Serve para igualar denominadores e achar quando algo se repete.<div class='ex'>MMC de 4 e 6 = <b>12</b></div>"],["MDC","Maior divisor comum. Serve para dividir em partes iguais sem sobra.<div class='ex'>MDC de 12 e 18 = <b>6</b></div>"]],
q:[["Qual a média de 6, 8 e 10?",8],["Qual o MMC de 4 e 6?",12],["Qual o MDC de 12 e 18?",6],["Dois ônibus saem juntos. Um volta a cada 4 min e o outro a cada 6 min. Em quantos minutos saem juntos de novo?",12]]},
{g:"Matemática",id:"pot",n:"Potência, raiz e Pitágoras",math:1,
e:[["Potência","Multiplique o número por ele mesmo.<div class='ex'>3² = 3 × 3 = <b>9</b> | 2³ = 2 × 2 × 2 = <b>8</b></div>"],["Raiz quadrada","É o contrário da potência.<div class='ex'>√49 = <b>7</b>, pois 7² = 49</div>"],["Pitágoras","No triângulo retângulo: <b>hipotenusa² = cateto² + cateto²</b>.<div class='ex'>Catetos 3 e 4 → 9 + 16 = 25 → hipotenusa = <b>5</b></div>"]],
q:[["Quanto é 2³?",8],["Quanto é √81?",9],["Catetos 6 e 8. Quanto vale a hipotenusa?",10],["Quanto é 5² − 3²?",16]]},
{g:"Ciências",id:"bio",n:"Biologia: célula e corpo",
e:[["Célula","Unidade da vida. O <b>núcleo</b> guarda o DNA; a <b>membrana</b> controla o que entra e sai."],["Sistemas do corpo","<b>Circulatório:</b> coração e sangue. <b>Respiratório:</b> pulmões. <b>Digestório:</b> estômago e intestino. <b>Excretor:</b> rins. <b>Locomotor:</b> ossos e músculos."],["Plantas","<b>Fotossíntese:</b> gás carbônico + água + luz → glicose + oxigênio, nas folhas. As raízes absorvem água e sais."]],
q:[["Qual órgão filtra o sangue e produz urina?",["Fígado","Rim","Pulmão","Coração"],1,"Os rins fazem a filtragem."],["Onde fica o DNA da célula?",["Membrana","Núcleo","Parede","Folha"],1,"No núcleo."],["Qual gás as plantas liberam na fotossíntese?",["Gás carbônico","Nitrogênio","Oxigênio","Hidrogênio"],2,"Elas liberam oxigênio."]]},
{g:"Ciências",id:"qui",n:"Química: matéria e misturas",
e:[["Estados da matéria","Sólido (forma fixa), líquido (toma a forma do recipiente) e gasoso (ocupa todo o espaço). Mudanças: fusão, evaporação, condensação e solidificação."],["Misturas","<b>Homogênea:</b> uma fase só (água com sal). <b>Heterogênea:</b> mais de uma fase (água e óleo)."],["Reação química","Surgem novas substâncias (ferrugem, queima). Na mudança física só muda a forma (rasgar papel)."]],
q:[["Água e areia formam uma mistura:",["Homogênea","Heterogênea","Simples","Nuclear"],1,"Têm duas fases visíveis."],["Gelo derretendo é:",["Fusão","Evaporação","Condensação","Combustão"],0,"Sólido para líquido é fusão."],["Qual é uma reação química?",["Ferro enferrujando","Amassar papel","Gelo derretendo","Cortar madeira"],0,"Forma outra substância."]]},
{g:"Ciências",id:"fis",n:"Física: movimento e energia",math:1,
e:[["Velocidade média","<b>v = distância ÷ tempo</b><div class='ex'>120 km em 2 h → <b>60 km/h</b></div>"],["Energia e calor","A energia se transforma (química → elétrica numa pilha). O calor passa do corpo mais quente para o mais frio. Metais conduzem bem; isopor e borracha isolam."],["Densidade e inércia","<b>densidade = massa ÷ volume</b>. <b>Inércia:</b> o corpo tende a manter seu movimento (por isso você vai para a frente quando o carro freia)."]],

{g:"Ciências",id:"seg",n:"Segurança e meio ambiente",
e:[["EPI e EPC","<b>EPI</b> protege cada pessoa (capacete, luva, óculos, protetor auricular). <b>EPC</b> protege o grupo (grade, sinalização, exaustor)."],["NR","<b>NR</b> significa Norma Regulamentadora; essas normas definem medidas de segurança e saúde no trabalho."],["Meio ambiente","Renováveis: solar, eólica, água. Não renováveis: petróleo e carvão. Reciclar poupa recursos."]],

{g:"Matemática",id:"razao",n:"Razão e proporção",
e:[["Razão","Razão é a divisão entre dois números. A razão de 3 para 4 é 3/4.<div class='ex'>20 alunos para 5 professores → 20 ÷ 5 = <b>4 alunos por professor</b></div>"],["Proporção","Proporção é a igualdade entre duas razões. Multiplique em cruz para achar o termo que falta.<div class='ex'>2/3 = x/12 → 3x = 24 → x = <b>8</b></div>"],["Escala","Escala = medida no desenho ÷ medida real.<div class='ex'>Escala 1:100: 5 cm no desenho = 500 cm = <b>5 m</b> na realidade</div>"]],

{g:"Português",id:"tipo",n:"Tipos e gêneros de texto",

,{g:"Ciências",id:"hered",n:"Reprodução e hereditariedade",ic:"",e:[

  });

 function correct(item,a){if(!a)return false;return a.value===item.q[2]}

   sv('sn_date',d);sv('sn_start',TD());sv('sn_hours',h);sv('sn_days',JSON.stringify(days));sv('sn_time_start',ts);sv('sn_time_end',te);sv('sn_schedule_done','1');sv('sn_diag_done','1');
